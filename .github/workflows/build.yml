name: "Build NewPipe Custom"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: "Get the patch from this repo"
        uses: actions/checkout@v6

      - name: "Download NewPipe v0.29.1 and apply the patch"
        run: |
          git clone --depth 1 --branch v0.29.1 https://github.com/TeamNewPipe/NewPipe.git np
          cd np
          git switch -c master
          git apply --binary ../newpipe-custom.patch
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: "Build APK"
        working-directory: np
        run: ./gradlew assembleContinuous --stacktrace

      - name: "Rename APK"
        run: mv np/app/build/outputs/apk/continuous/*.apk "NewPipe-Custom-${{ github.run_number }}.apk"

      - name: "Upload APK"
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-Custom
          path: NewPipe-Custom-*.apk

      - name: "Publish APK as a release (direct download)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" NewPipe-Custom-*.apk \
            --repo "${{ github.repository }}" \
            --title "NewPipe Custom build ${{ github.run_number }}" \
            --notes "YouTube-style NewPipe v0.29.1 build."
